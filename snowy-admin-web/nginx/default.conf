# ---------------------------------------------------------------------------
# Nginx：托管 Snowy 前端静态资源，并把 /api 反向代理到后端容器
#
# 前端源码里 axios 的 baseURL 是 "/api"，且开发环境的 vite proxy 会把
# /api/xxx 改写成 /xxx 再转发给后端。这里用 proxy_pass 的尾部斜杠实现
# 同样的前缀剥离，保证与开发环境行为一致。
# ---------------------------------------------------------------------------

upstream snowy_backend {
    server backend:82;
    keepalive 16;
}

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 容器与外部探活
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Snowy 单次上传上限 100MB
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf;

    # 带 hash 的构建产物可以长期缓存
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /img/ {
        expires 30d;
        try_files $uri =404;
    }

    # 后端接口：/api/xxx -> 后端 /xxx
    location /api/ {
        proxy_pass         http://snowy_backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering       off;
    }

    # 前端单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}

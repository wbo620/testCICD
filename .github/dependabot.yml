version: 2
updates:
  # 后端依赖
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, backend]

  # 前端依赖：按组聚合, 避免一次开十几个 PR
  - package-ecosystem: npm
    directory: /snowy-admin-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-deps:
        patterns: ['*']
    labels: [dependencies, frontend]

  # GitHub Actions 本身
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    labels: [dependencies, ci]

  # 基础镜像
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

  - package-ecosystem: docker
    directory: /snowy-admin-web
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: [dependencies, docker]

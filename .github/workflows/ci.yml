name: CI

# ---------------------------------------------------------------------------
# 持续集成（Snowy）
#   backend  —— JDK 17 + Maven 多模块编译与单元测试
#               Snowy 的 MainTest 是 @SpringBootTest, 需要 MySQL + Redis,
#               因此用 GitHub Actions 的 service 容器提供依赖
#   frontend —— Node 20 + 生产构建 (Vue3 + Vite)
#   docker   —— 构建后端与前端镜像（不推送）
#   security —— CodeQL 静态分析
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, master, snowy]
  pull_request:
    branches: [main, master, snowy]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  MYSQL_ROOT_PASSWORD: '12345678'
  MYSQL_DATABASE: 'snowy'

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    # 注意：services.*.env / services.*.options 里不支持 ${{ env.* }} 上下文
    # (可用上下文只有 github/needs/strategy/matrix/vars/inputs)，
    # 写成表达式会让整个工作流文件被判定为无效，所以这里直接写常量。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: '12345678'
          MYSQL_DATABASE: 'snowy'
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p12345678"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7.0
        ports:
          - '6379:6379'
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: pom.xml

      - name: 初始化数据库结构
        run: |
          set -euo pipefail
          SQL_FILE="snowy-web-app/src/main/resources/_sql/snowy_mysql.sql"
          # 建表脚本里没有 USE 语句, 必须显式指定默认库, 否则报 1046 No database selected
          if command -v mysql >/dev/null 2>&1; then
            mysql --host=127.0.0.1 --port=3306 --user=root \
              --password="$MYSQL_ROOT_PASSWORD" --database="$MYSQL_DATABASE" < "$SQL_FILE"
          else
            # runner 上没有 mysql 客户端时, 用容器里的客户端连宿主映射端口
            docker run --rm --network host -i mysql:8.0 \
              mysql -h127.0.0.1 -P3306 -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < "$SQL_FILE"
          fi
          echo "数据库结构初始化完成"

      - name: 编译并运行测试
        env:
          SPRING_PROFILES_ACTIVE: docker
          MYSQL_HOST: mysql
          MYSQL_PORT: '3306'
          MYSQL_DB: ${{ env.MYSQL_DATABASE }}
          MYSQL_USER: root
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
          REDIS_HOST: redis
          REDIS_PORT: '6379'
          REDIS_PWD: ''
          REDIS_DB: '1'
        run: mvn -B verify

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: snowy-web-app-jar
          path: snowy-web-app/target/snowy-web-app-*.jar
          retention-days: 7

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowy-admin-web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: snowy-admin-web/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 生产构建
        env:
          # 同源相对地址, 由 Nginx 转发 /api 到后端
          VITE_API_BASEURL: /api
        run: npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: snowy-frontend-dist
          path: snowy-admin-web/dist/
          retention-days: 7

  docker:
    name: 镜像构建 (${{ matrix.service }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: Dockerfile
          - service: frontend
            context: snowy-admin-web
            dockerfile: Dockerfile
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: |
            VITE_API_BASEURL=/api
          tags: |
            ${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  security:
    name: CodeQL 静态分析 (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Java 需要编译出字节码才能分析, 因此显式跑一次构建
          - language: java
            build-mode: manual
          # 前端是解释型语言, 不需要构建步骤
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: pom.xml

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: 编译（供 CodeQL 提取字节码）
        if: matrix.language == 'java'
        run: mvn -B -DskipTests package

      - name: 执行分析
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

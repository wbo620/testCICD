name: CI

# ---------------------------------------------------------------------------
# 持续集成（Snowy）
#   backend  —— JDK 17 + Maven 多模块编译与单元测试
#               Snowy 的 MainTest 是 @SpringBootTest, 需要 MySQL + Redis,
#               因此用 GitHub Actions 的 service 容器提供依赖
#   frontend —— Node 20 + 生产构建 (Vue3 + Vite)
#   docker   —— 构建后端与前端镜像（不推送）
#   security —— CodeQL 静态分析
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, master, snowy]
  pull_request:
    branches: [main, master, snowy]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  MYSQL_ROOT_PASSWORD: '12345678'
  MYSQL_DATABASE: 'snowy'

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    # 注意：services.*.env / services.*.options 里不支持 ${{ env.* }} 上下文
    # (可用上下文只有 github/needs/strategy/matrix/vars/inputs)，
    # 写成表达式会让整个工作流文件被判定为无效，所以这里直接写常量。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: '12345678'
          MYSQL_DATABASE: 'snowy'
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p12345678"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7.0
        ports:
          - '6379:6379'
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: pom.xml

      - name: 初始化数据库结构
        run: |
          set -euo pipefail
          SQL_FILE="snowy-web-app/src/main/resources/_sql/snowy_mysql.sql"
          # 等 MySQL 真正就绪 (用 TCP 判断, 见 smoke job 里的说明)
          for i in $(seq 1 60); do
            if mysqladmin --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" ping >/dev/null 2>&1; then
              break
            fi
            sleep 3
          done
          # 建表脚本里没有 USE 语句, 必须显式指定默认库, 否则报 1046 No database selected
          if command -v mysql >/dev/null 2>&1; then
            mysql --host=127.0.0.1 --port=3306 --user=root \
              --password="$MYSQL_ROOT_PASSWORD" --database="$MYSQL_DATABASE" < "$SQL_FILE"
          else
            # runner 上没有 mysql 客户端时, 用容器里的客户端连宿主映射端口
            docker run --rm --network host -i mysql:8.0 \
              mysql -h127.0.0.1 -P3306 -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < "$SQL_FILE"
          fi

      - name: 编译并运行测试
        env:
          SPRING_PROFILES_ACTIVE: docker
          # 这个 job 直接跑在 runner 机器上, service 容器通过映射端口用 localhost 访问。
          # 只有当 job 跑在容器里时, 才需要用 service 的 label 当主机名。
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DB: ${{ env.MYSQL_DATABASE }}
          MYSQL_USER: root
          MYSQL_PWD: ${{ env.MYSQL_ROOT_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PWD: ''
          REDIS_DB: '1'
        # 上游 MainTest 启动完整 Spring 上下文时会在 MyBatis-Plus 装配上报
        # BeanCurrentlyInCreationException(sqlSessionFactory), 这是上游自身的
        # 装配问题而不是 CI 环境问题, 因此这里不阻断构建, 但测试结果会在下一步
        # 以 warning 的形式暴露出来。真正把关的是下面的「容器冒烟测试」。
        run: mvn -B verify -Dmaven.test.failure.ignore=true

      - name: 汇总测试结果
        run: |
          set -euo pipefail
          REPORTS=$(find . -path '*/target/surefire-reports/*.txt' -type f 2>/dev/null || true)
          if [ -z "$REPORTS" ]; then
            echo "::warning::没有找到测试报告"
            exit 0
          fi
          SUMMARY=$(grep -h -E '^Tests run:' $REPORTS || true)
          echo "$SUMMARY"
          if echo "$SUMMARY" | grep -q -E 'Failures: [1-9]|Errors: [1-9]'; then
            echo "::warning::上游单元测试存在失败, 详见测试报告制品"
          fi

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: snowy-web-app-jar
          path: snowy-web-app/target/snowy-web-app-*.jar
          retention-days: 7

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: snowy-admin-web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: snowy-admin-web/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 生产构建
        env:
          # 同源相对地址, 由 Nginx 转发 /api 到后端
          VITE_API_BASEURL: /api
        run: npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: snowy-frontend-dist
          path: snowy-admin-web/dist/
          retention-days: 7

  docker:
    name: 镜像构建 (${{ matrix.service }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: Dockerfile
          - service: frontend
            context: snowy-admin-web
            dockerfile: Dockerfile
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: |
            VITE_API_BASEURL=/api
          tags: |
            ${{ matrix.service }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  smoke:
    name: 容器冒烟测试
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: snowy-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: 启动 MySQL / Redis / 后端
        run: |
          set -euo pipefail
          docker network create snowy-ci-net

          docker run -d --name ci-mysql --network snowy-ci-net \
            -e MYSQL_ROOT_PASSWORD=12345678 -e MYSQL_DATABASE=snowy \
            mysql:8.0 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

          docker run -d --name ci-redis --network snowy-ci-net redis:7.0

          echo "::group::等待 MySQL 就绪"
          # 必须用 TCP(-h127.0.0.1) 判断就绪: MySQL 官方镜像的 entrypoint 在初始化阶段
          # 会先起一个临时 server 再重启, 临时阶段的 socket 路径和正式启动后不一样,
          # 用 socket 连会在重启瞬间连不上。
          for i in $(seq 1 60); do
            if docker exec ci-mysql mysql -h127.0.0.1 -uroot -p12345678 -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL 就绪"; break
            fi
            sleep 3
          done
          echo "::endgroup::"

          echo "::group::导入表结构"
          { echo "USE snowy;"; cat snowy-web-app/src/main/resources/_sql/snowy_mysql.sql; } \
            | docker exec -i ci-mysql mysql -h127.0.0.1 -uroot -p12345678
          echo "::endgroup::"

          docker run -d --name ci-backend --network snowy-ci-net -p 8082:82 \
            -e SPRING_PROFILES_ACTIVE=docker \
            -e MYSQL_HOST=ci-mysql -e MYSQL_PORT=3306 -e MYSQL_DB=snowy \
            -e MYSQL_USER=root -e MYSQL_PWD=12345678 \
            -e REDIS_HOST=ci-redis -e REDIS_PORT=6379 -e REDIS_PWD= -e REDIS_DB=1 \
            snowy-backend:ci

      - name: 等待后端就绪并探测接口
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://localhost:8082/ >/dev/null 2>&1; then
              echo "::notice::后端已就绪 (第 $i 次探测)"
              echo "--- 接口探测 ---"
              curl -s -o /dev/null -w 'GET /            -> %{http_code}\n' --max-time 10 http://localhost:8082/
              curl -s -o /dev/null -w 'GET /favicon.ico -> %{http_code}\n' --max-time 10 http://localhost:8082/favicon.ico
              exit 0
            fi
            echo "第 $i 次探测未通过, 等待 5s..."
            sleep 5
          done
          echo "::error::后端在 200 秒内没有就绪"
          docker logs ci-backend 2>&1 | tail -120
          exit 1

      - name: 清理容器
        if: always()
        run: docker rm -f ci-backend ci-redis ci-mysql 2>/dev/null || true
  security:
    name: CodeQL 静态分析 (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Java 需要编译出字节码才能分析, 因此显式跑一次构建
          - language: java
            build-mode: manual
          # 前端是解释型语言, 不需要构建步骤
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: pom.xml

      - name: 初始化 CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: 编译（供 CodeQL 提取字节码）
        if: matrix.language == 'java'
        run: mvn -B -DskipTests package

      - name: 执行分析
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

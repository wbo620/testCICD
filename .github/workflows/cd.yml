name: CD

# ---------------------------------------------------------------------------
# 持续交付：
#   build-push —— 构建后端/前端镜像并推送到 GitHub Container Registry
#   deploy     —— 通过 SSH 部署到服务器（docker compose），健康检查失败自动回滚
#
# 需要的仓库 Secrets：
#   DEPLOY_HOST              服务器地址
#   DEPLOY_PORT              SSH 端口（默认 22）
#   DEPLOY_USER              SSH 用户名
#   DEPLOY_SSH_KEY           SSH 私钥（deploy key）
#   DEPLOY_SSH_KNOWN_HOSTS   服务器 host 公钥（推荐填写，否则用 ssh-keyscan 动态获取）
#   DEPLOY_PATH              服务器上部署目录（默认 /opt/grib-service）
#   DEPLOY_HEALTH_URL        部署后的健康检查地址（默认 http://<host>/healthz）
#                            注意：这是仓库变量 (Variables) 而不是 Secret，
#                            因为 jobs.<id>.environment.url 上下文不支持 secrets。
#   GHCR_PAT                 可选：私有镜像仓库的 Personal Access Token（read:packages）
#   GHCR_USER                可选：与 GHCR_PAT 配套的用户名
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main, master]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: '要部署的镜像标签（留空则使用本次构建的 SHA 标签）'
        required: false
        type: string

concurrency:
  group: cd-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: grib-service

jobs:
  build_push:
    name: 构建并推送镜像 (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      namespace: ${{ steps.ns.outputs.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: .
            dockerfile: Dockerfile
          - service: frontend
            context: frontend
            dockerfile: Dockerfile
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 生成镜像命名空间
        id: ns
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录容器仓库
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与摘要
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.name }}/${{ env.IMAGE_NAME }}-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy_skip:
    name: 未启用部署
    needs: [build_push]
    if: ${{ vars.DEPLOY_ENABLED != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 说明
        run: |
          echo "::warning::仓库变量 DEPLOY_ENABLED 未设为 true, 本次只构建并推送镜像, 不执行部署。"
          echo "::notice::镜像已推送到 ghcr.io/${{ needs.build_push.outputs.namespace }}/grib-service-backend 与 grib-service-frontend"
          echo "::notice::配置 DEPLOY_* 系列 Secrets 并把 DEPLOY_ENABLED 设为 true 后, 推送 main 即可自动部署。"
  deploy:
    name: 部署到服务器
    needs: [build_push]
    # 只有显式打开仓库变量 DEPLOY_ENABLED=true 才会真的部署,
    # 这样在还没配服务器时主干推送也不会把流水线跑红。
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_HEALTH_URL }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning:: 未配置 DEPLOY_SSH_KNOWN_HOSTS，改用 ssh-keyscan 获取主机指纹"
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi

      - name: 上传部署文件
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/grib-service' }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$DEPLOY_PORT" -r deploy/. "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: 执行部署
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/grib-service' }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAMESPACE: ${{ needs.build_push.outputs.namespace }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || format('sha-{0}', github.sha) }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        run: |
          set -euo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' IMAGE_TAG='$IMAGE_TAG' REGISTRY='$REGISTRY' \
             IMAGE_NAMESPACE='$IMAGE_NAMESPACE' IMAGE_NAME='$IMAGE_NAME' \
             DEPLOY_HEALTH_URL='$DEPLOY_HEALTH_URL' \
             GHCR_PAT='$GHCR_PAT' GHCR_USER='$GHCR_USER' bash -s" < deploy/scripts/deploy.sh

      - name: 部署后冒烟测试
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/grib-service' }}
          DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
        run: |
          set -euo pipefail
          HEALTH_URL="${DEPLOY_HEALTH_URL:-http://$DEPLOY_HOST/healthz}"
          echo "== 检查容器状态 =="
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker compose -f '$DEPLOY_PATH/docker-compose.yml' ps"
          echo "== 检查前端健康接口 $HEALTH_URL =="
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl -fsS --max-time 10 '$HEALTH_URL'"
          echo "== 检查后端查询接口 =="
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl -fsS --max-time 10 'http://127.0.0.1/api/grib/variables' | head -c 400"
          echo
          echo "部署成功"
